name: Chequear nuevas funciones de La Odisea

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: imax-norcenter-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Configurar Git
        run: |
          git config user.name "showcase-bot"
          git config user.email "actions@github.com"

      - name: Chequear cada 10 minutos
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          for i in 1 2 3 4 5 6; do
            echo "========================================"
            echo "Chequeo $i/6 - $(date -u)"
            echo "========================================"

            git pull --rebase origin main || true
            python monitor.py || true

            git add notified_state.json || true

            if ! git diff --cached --quiet; then
              git commit -m "actualizar estado IMAX [skip ci]"
              git push origin main || {
                git pull --rebase origin main
                git push origin main
              }
            fi

            if [ "$i" -lt 6 ]; then
              echo "Esperando 10 minutos..."
              sleep 600
            fi
          done
